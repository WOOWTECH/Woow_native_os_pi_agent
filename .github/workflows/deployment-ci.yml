name: deployment-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery-and-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The maintenance suite compares legacy outputs with exact a1149879 sources.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python adapter fixture dependencies
        run: python -m pip install httpx==0.28.1 PyYAML==6.0.3
      - name: Local connection retry and authorization boundaries
        run: python3 -m unittest discover -s tests -p 'test_local_resume.py' -v
      - name: Prebuilt artifact release binding and retained installation
        run: node --test tests/artifact-manifest.test.mjs
      - name: Native maintenance consumer composition and refusal boundaries
        run: python3 -B tests/native-maintenance-consumers.test.py
      - name: Shared runtime archive and migration contracts
        run: |
          . lib/pins.sh
          echo "$PIN_SHARED_RUNTIME_SHA256  candidate-packages/woowtech-pi-agent-shared-runtime-$PIN_SHARED_RUNTIME_VERSION.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/shared-runtime"
          tar -xzf "candidate-packages/woowtech-pi-agent-shared-runtime-$PIN_SHARED_RUNTIME_VERSION.tgz" --strip-components=1 -C "$RUNNER_TEMP/shared-runtime"
          npm ci --prefix "$RUNNER_TEMP/shared-runtime" --omit=dev --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          node --test "$RUNNER_TEMP/shared-runtime/tests/distribution.test.mjs"
          # Resolve the same immutable Pi Web + combined-adapter graph as install.sh.
          # The candidate adapter upgrades the original SDK1.0 to SDK1.4.
          git init -q "$RUNNER_TEMP/pi-web-sdk"
          git -C "$RUNNER_TEMP/pi-web-sdk" fetch --depth=1 "$PIN_PI_WEB_REPO" "$PIN_PI_WEB_REF"
          git -C "$RUNNER_TEMP/pi-web-sdk" checkout --detach -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pi-web-sdk" rev-parse HEAD)" = "$PIN_PI_WEB_REF"
          echo "$PIN_OMNIGENT_PLUGIN_SHA256  candidate-packages/woowtech-pi-omnigent-plugin-$PIN_OMNIGENT_PLUGIN_VERSION.tgz" | sha256sum --check --strict
          tar -xOf "candidate-packages/woowtech-pi-omnigent-plugin-$PIN_OMNIGENT_PLUGIN_VERSION.tgz" package/integrations/pi-web/combined.adapter.patch > "$RUNNER_TEMP/combined.adapter.patch"
          echo "$PIN_OMNIGENT_UI_SHA256  $RUNNER_TEMP/combined.adapter.patch" | sha256sum --check --strict
          git -C "$RUNNER_TEMP/pi-web-sdk" apply --check "$RUNNER_TEMP/combined.adapter.patch"
          git -C "$RUNNER_TEMP/pi-web-sdk" apply "$RUNNER_TEMP/combined.adapter.patch"
          npm ci --prefix "$RUNNER_TEMP/pi-web-sdk" --omit=dev --ignore-scripts --no-audit --no-fund
          PI_SHARED_SDK_ROOT="$RUNNER_TEMP/pi-web-sdk" node --test "$RUNNER_TEMP/shared-runtime/tests/resource-authority.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/resource-boundary.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/extension-scan.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/bridge.test.mjs" "$RUNNER_TEMP/shared-runtime/tests/mcp-adapter.test.mjs"
          NATIVE_DISTRIBUTION=1 SHARED_RUNTIME_TEST_BUNDLE="$RUNNER_TEMP/shared-runtime" PI_SHARED_SDK_ROOT="$RUNNER_TEMP/pi-web-sdk" node --test tests/shared-distribution.test.mjs tests/shared-session.test.mjs tests/shared-sync-only.test.mjs
          node --check rootfs/bin/pi-agent-shared-session.mjs
      - name: Pinned plugin patch composition and installer lifecycle
        run: |
          bash tests/model-options-hook.sh
          bash tests/intel-mac.sh
          bash tests/resume-no-proc.sh
          bash tests/host-name.sh
          bash tests/installer-rerun.sh
          bash tests/macos-ci-isolation.sh
          bash tests/cli-wrappers.sh
          bash tests/pi-wrapper-session-home.sh
