# Windows (WSL2) installer: unit tests, and an end-to-end run on a GitHub-hosted Windows runner.
#
# The e2e job is also the SPIKE of docs/WSL2-PLAN.md (experiments E1, E2, E3, E5, E9): it finds out
# whether a hosted runner can run a real WSL2 distro at all. It prints everything useful and always
# uploads its logs. It cannot test the first-time WSL enablement and reboot (E13): the runner image
# already has WSL, and nothing here can reboot.
#
# workflow_dispatch only works for workflow files on the default branch, so this workflow starts on
# push to the feature branch instead.
name: wsl2-windows

on:
  push:
    branches: [windows-wsl2]
    paths:
      - 'windows/**'
      - 'scripts/wsl-*'
      - 'scripts/build-wsl-bundle.sh'
      - 'lib/wsl.sh'
      - 'rootfs/bin/pi-agent*'
      - 'tests/wsl-*'
      - '.github/workflows/wsl2-windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'scripts/wsl-*'
      - 'scripts/build-wsl-bundle.sh'
      - 'lib/wsl.sh'
      - 'rootfs/bin/pi-agent*'
      - 'tests/wsl-*'
      - '.github/workflows/wsl2-windows.yml'

permissions:
  contents: read

concurrency:
  group: wsl2-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.shell }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    # `matrix` is not available in a step's own `shell:`, but it is here.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5 and PSScriptAnalyzer
        run: |
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      # The release adds a BOM to install-wsl.ps1; Windows PowerShell 5.1 reads a file without one as
      # ANSI and would break on the Chinese messages. Parse the BOM copy with this very shell.
      - name: Parse check
        run: |
          $failed = $false
          foreach ($rel in 'windows/install-wsl.ps1', 'windows/tests/install-wsl.Tests.ps1') {
            $text = [System.IO.File]::ReadAllText((Resolve-Path $rel).Path, [System.Text.Encoding]::UTF8)
            $copy = Join-Path $env:RUNNER_TEMP ('parse-' + [System.IO.Path]::GetFileName($rel))
            [System.IO.File]::WriteAllText($copy, $text, (New-Object System.Text.UTF8Encoding($true)))
            $tokens = $null
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($copy, [ref]$tokens, [ref]$errs)
            if ($errs -and $errs.Count -gt 0) {
              foreach ($e in $errs) { Write-Host ('::error file=' + $rel + ',line=' + $e.Extent.StartLineNumber + '::' + $e.Message) }
              $failed = $true
            } else {
              Write-Host ($rel + ' parses cleanly under PowerShell ' + $PSVersionTable.PSVersion)
            }
          }
          if ($failed) { exit 1 }

      - name: Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'windows/tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'pester-${{ matrix.shell }}.xml'
          $r = Invoke-Pester -Configuration $cfg
          # The job log needs a GitHub sign-in to read; annotations do not. Say what failed there too.
          try {
            $L = New-Object System.Collections.ArrayList
            [void]$L.Add(('passed ' + $r.PassedCount + ', failed ' + $r.FailedCount + ', blocks failed ' + $r.FailedBlocksCount + ', containers failed ' + $r.FailedContainersCount + ', not run ' + $r.NotRunCount))
            # A file that cannot even start fails all its tests with no message of their own: say why first.
            foreach ($c in @($r.Containers)) {
              foreach ($e in @($c.ErrorRecord)) { [void]$L.Add('CONTAINER ERROR: ' + ($e | Out-String).Trim()) }
              foreach ($b in @($c.Blocks)) {
                foreach ($e in @($b.ErrorRecord)) { [void]$L.Add('BLOCK ERROR (' + $b.Name + '): ' + ($e | Out-String).Trim()) }
              }
            }
            foreach ($t in @($r.Failed | Select-Object -First 8)) {
              $err = (@($t.ErrorRecord) | ForEach-Object { ($_ | Out-String).Trim() }) -join ' | '
              [void]$L.Add('* ' + $t.ExpandedPath + ' :: ' + $err)
            }
            $text = ($L -join "`n")
            if ($text.Length -gt 6500) { $text = $text.Substring(0, 6500) }
            $enc = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host ('::notice title=Pester result (${{ matrix.shell }})::' + $enc)
          } catch {
            Write-Host ('::warning::could not summarise the Pester result: ' + $_)
          }
          if ($r.FailedCount -gt 0 -or $r.FailedBlocksCount -gt 0 -or $r.FailedContainersCount -gt 0) { exit 1 }

      # Errors fail the job; warnings are shown as annotations. Write-Host is how this script talks to
      # the user, and the file has no BOM in the repository (the release adds it), so those two rules
      # would only be noise.
      - name: PSScriptAnalyzer
        if: always() && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $skip = @('PSAvoidUsingWriteHost', 'PSUseShouldProcessForStateChangingFunctions', 'PSUseBOMForUnicodeEncodedFile', 'PSAvoidGlobalVars', 'PSUseSingularNouns')
          $found = @(Invoke-ScriptAnalyzer -Path windows -Recurse -ExcludeRule $skip)
          foreach ($f in $found) {
            $level = 'notice'
            if ($f.Severity -eq 'Error') { $level = 'error' } elseif ($f.Severity -eq 'Warning') { $level = 'warning' }
            Write-Host ('::' + $level + ' file=' + $f.ScriptPath + ',line=' + $f.Line + '::' + $f.RuleName + ': ' + $f.Message)
          }
          $errors = @($found | Where-Object { $_.Severity -eq 'Error' })
          Write-Host ('PSScriptAnalyzer: ' + $errors.Count + ' error(s), ' + @($found | Where-Object { $_.Severity -eq 'Warning' }).Count + ' warning(s)')
          if ($errors.Count -gt 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pester-${{ matrix.shell }}
          path: pester-${{ matrix.shell }}.xml
          if-no-files-found: ignore

  e2e:
    name: e2e (real WSL2 on a hosted runner)
    needs: unit
    # Run even when the unit tests are red: this job is the spike, and what it learns about the
    # runner does not depend on them.
    if: ${{ !cancelled() }}
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: What does this runner have?
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $env:WSL_UTF8 = '1'
          $log = 'ci-out/00-environment.txt'
          function Run($title, [scriptblock]$sb) {
            ('=== ' + $title) | Tee-Object -FilePath $log -Append
            try { (& $sb 2>&1 | Out-String).TrimEnd() | Tee-Object -FilePath $log -Append }
            catch { ('ERROR: ' + $_) | Tee-Object -FilePath $log -Append }
          }
          Run 'wsl --version' { wsl --version }
          Run 'wsl --status' { wsl --status }
          Run 'wsl -l -v' { wsl -l -v }
          Run 'virtualization (Get-ComputerInfo)' { Get-ComputerInfo -Property 'HyperV*', 'OsName', 'OsBuildNumber' | Format-List }
          Run 'Windows features' { Get-WindowsOptionalFeature -Online | Where-Object { $_.FeatureName -match 'Hyper-V|VirtualMachinePlatform|Linux' } | Format-Table FeatureName, State }
          Run 'systeminfo (Hyper-V lines)' { systeminfo | Select-String -Pattern 'Hyper-V|Virtualization|Hypervisor' }
          Run 'memory and disk' { Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory, HypervisorPresent | Format-List; Get-PSDrive C | Format-List Used, Free }

      - name: Build the installer bundle
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/build-wsl-bundle.sh dist dev
          ls -l dist

      # Windows PowerShell 5.1 on purpose: that is what a user has. The release adds the BOM.
      # The pi-web build is the one attached to the v0.2.4 release (README names the same file for v0.2.3;
      # a HEAD request on 2026-11-03 answered 200 for both).
      - name: Install (this is the WSL2 spike)
        id: install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force dist, ci-out | Out-Null
          $text = Get-Content -Raw -Encoding UTF8 windows\install-wsl.ps1
          $script = Join-Path (Get-Location).Path 'dist\install-wsl.ps1'
          [System.IO.File]::WriteAllText($script, $text, (New-Object System.Text.UTF8Encoding($true)))
          $bundle = Join-Path (Get-Location).Path 'dist\pi-agent-installer-dev.tar.gz'
          & $script -Yes -NoAutostart -BundlePath $bundle -PiWebArtifact 'https://github.com/WOOWTECH/Woow_native_os_pi_agent/releases/download/v0.2.4/piweb-0.10.0-linux-x64.tar.gz' *>&1 | Tee-Object -FilePath ci-out/10-install.txt
          $code = $LASTEXITCODE
          ('install-wsl.ps1 exit code: ' + $code) | Tee-Object -FilePath ci-out/10-install.txt -Append
          exit $code

      # The command the docs give, word for word, served from a local HTTP server: download, UTF-8
      # decode, strip the BOM, ScriptBlock, parameters after it. Nothing of that was ever executed,
      # and it is what a user types. -DryRun changes nothing.
      - name: E1 the documented one-line command (dry run)
        if: always() && steps.install.outcome == 'success'
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $log = 'ci-out/15-oneliner.txt'
          $srv = Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $u = 'http://127.0.0.1:8765/install-wsl.ps1'
          $bundle = Join-Path (Get-Location).Path 'dist\pi-agent-installer-dev.tar.gz'
          $before = (wsl -l -q | Out-String)
          $out = & ([ScriptBlock]::Create(([Text.Encoding]::UTF8.GetString((Invoke-WebRequest -UseBasicParsing $u).RawContentStream.ToArray())).TrimStart([char]0xFEFF))) -DryRun -BundlePath $bundle *>&1
          $code = $LASTEXITCODE
          $text = ($out | Out-String)
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          $zh = -join ([char]0x6B65, [char]0x9A5F)
          ('exit code seen by the caller: ' + $code) | Tee-Object -FilePath $log
          ('this console is still alive (the installer did not call exit): True') | Tee-Object -FilePath $log -Append
          ('Chinese came through intact (the two characters of the word for "step"): ' + $text.Contains($zh)) | Tee-Object -FilePath $log -Append
          ('the list of distros is unchanged: ' + ($before -eq (wsl -l -q | Out-String))) | Tee-Object -FilePath $log -Append
          ($text.Trim() -split "`r?`n" | Select-Object -First 14) | Tee-Object -FilePath $log -Append

      - name: Probes
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $env:WSL_UTF8 = '1'
          $log = 'ci-out/20-probes.txt'
          function Say($t) { $t | Tee-Object -FilePath $log -Append }
          function Run($title, [scriptblock]$sb) {
            Say ('=== ' + $title)
            try { Say ((& $sb 2>&1 | Out-String).TrimEnd()) }
            catch { Say ('ERROR: ' + $_) }
          }
          Run 'wsl -l -v' { wsl -l -v }
          Run 'pi-web answers on localhost:30141 (seen from Windows)' { curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://localhost:30141/api/home }
          Run 'pi-agent doctor' { wsl -d PiAgent -u piagent --exec /home/piagent/.local/share/pi-agent/bin/pi-agent doctor }
          $uid = (wsl -d PiAgent -u piagent --exec /usr/bin/id -u 2>$null | Out-String).Trim()
          $envs = @(('XDG_RUNTIME_DIR=/run/user/' + $uid), ('DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/' + $uid + '/bus'))
          Run 'systemd state' { wsl -d PiAgent -u root --exec /usr/bin/systemctl is-system-running }
          Run 'systemctl --user status pi-web' { wsl -d PiAgent -u piagent --exec /usr/bin/env @envs /usr/bin/systemctl --user status pi-web --no-pager }
          Run 'journalctl --user -u pi-web' { wsl -d PiAgent -u piagent --exec /usr/bin/env @envs /usr/bin/journalctl --user -u pi-web -n 200 --no-pager }
          Run 'memory and disk inside the distro' { wsl -d PiAgent -u root --exec /usr/bin/free -m; wsl -d PiAgent -u root --exec /usr/bin/df -h / }

      # E3: with no terminal open, does the distro stay up? First with the keep-alive the installer
      # started, then (control) with it stopped, past instanceIdleTimeout (15 s) and vmIdleTimeout (60 s).
      - name: E6 E7 Windows interop, from a session and from a systemd user service
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $env:WSL_UTF8 = '1'
          $log = 'ci-out/25-interop.txt'
          function Say($t) { $t | Tee-Object -FilePath $log -Append }
          function Run($title, [scriptblock]$sb) {
            Say ('=== ' + $title)
            try { Say ((& $sb 2>&1 | Out-String).TrimEnd()) } catch { Say ('ERROR: ' + $_) }
          }
          $pa = '/home/piagent/.local/share/pi-agent/bin'
          $envs = @('XDG_RUNTIME_DIR=/run/user/1000', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus')
          Run 'windows-interop.env' { wsl -d PiAgent -u piagent --exec /bin/cat /home/piagent/.local/share/pi-agent/windows-interop.env }
          Run 'E6 pi-agent-win ps, an ordinary session' { wsl -d PiAgent -u piagent --exec "$pa/pi-agent-win" ps 'Get-Date -Format o' }
          Run 'E7 does a systemd user service have WSL_INTEROP? (empty = no)' { wsl -d PiAgent -u piagent --exec /usr/bin/env @envs /usr/bin/systemd-run --user --pipe --wait --collect /usr/bin/printenv WSL_INTEROP }
          Run 'E7 pi-agent-win ps from that service' { wsl -d PiAgent -u piagent --exec /usr/bin/env @envs /usr/bin/systemd-run --user --pipe --wait --collect "$pa/pi-agent-win" ps 'Get-Date -Format o' }
          Run 'E6 pi-agent-win run cmd.exe' { wsl -d PiAgent -u piagent --exec "$pa/pi-agent-win" run cmd.exe /c ver }
          Run 'pi-agent doctor' { wsl -d PiAgent -u piagent --exec "$pa/pi-agent" doctor }

      # E10, part 1: the two plugins against real servers with no real account anywhere. Omnigent can run its
      # own server; the admin password is made up here, never printed, used once, and goes away with the VM.
      # What it cannot show is a conversation: that needs the engines to reach a model (a login or a gateway).
      - name: E10a Omnigent plugin against a throwaway local Omnigent server, and the Paseo plugin checks
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 25
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $env:WSL_UTF8 = '1'
          $log = 'ci-out/26-omnigent-paseo.txt'
          $pa = '/home/piagent/.local/share/pi-agent'
          $envs = @('XDG_RUNTIME_DIR=/run/user/1000', 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus')
          $pw = -join (((48..57) + (97..122)) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          $cookie = -join (1..64 | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
          function Say($t) { ([string]$t).Replace($pw, '***').Replace($cookie, '***') | Tee-Object -FilePath $log -Append }
          function Trunc($t, $n = 1700) { $s = ([string]$t).Trim(); if ($s.Length -gt $n) { $s.Substring(0, $n) + ' ...[cut]' } else { $s } }
          function Vm([string[]]$cmd) { (wsl -d PiAgent -u piagent --exec /usr/bin/env @envs @cmd 2>&1 | Out-String) }

          Say '=== the omnigent tool the plugin installed'
          $omni = $pa + '/data/omnigent-plugin/uv/tools/omnigent/bin/omnigent'
          Say (Trunc (Vm @('/bin/ls', '-l', $omni)))
          Say (Trunc (Vm @($omni, '--version')))

          Say '=== start a throwaway local Omnigent server (accounts mode, made-up admin password)'
          wsl -d PiAgent -u piagent --exec /bin/mkdir -p /tmp/omni-srv
          Say (Trunc (Vm @('/usr/bin/systemd-run', '--user', '--unit=omnigent-test-server', '--collect', '--setenv=HOME=/tmp/omni-srv', '--setenv=OMNIGENT_AUTH_PROVIDER=accounts', ('--setenv=OMNIGENT_ACCOUNTS_COOKIE_SECRET=' + $cookie), '--setenv=OMNIGENT_ACCOUNTS_BASE_URL=http://127.0.0.1:6767', ('--setenv=OMNIGENT_ACCOUNTS_INIT_ADMIN_PASSWORD=' + $pw), $omni, 'server', '--host', '127.0.0.1', '--port', '6767', '--no-open')))
          $up = $false
          for ($i = 0; $i -lt 45; $i++) {
            $code = (curl.exe -s -o NUL -w '%{http_code}' --max-time 3 http://127.0.0.1:6767/health)
            if ($code -eq '200') { $up = $true; break }
            Start-Sleep -Seconds 2
          }
          Say ('the local server answers /health from Windows: ' + $up)
          if (-not $up) { Say (Trunc (Vm @('/usr/bin/journalctl', '--user', '-u', 'omnigent-test-server', '-n', '40', '--no-pager')) 3000) }

          if ($up) {
            Say '=== pi-omnigent connect (password from stdin, as the plugin insists)'
            $cmd = "printf '%s\n' `$PW | $pa/bin/pi-omnigent connect --server http://127.0.0.1:6767 --username admin --password-stdin"
            Say (Trunc ((wsl -d PiAgent -u piagent --exec /usr/bin/env @envs ('PW=' + $pw) /bin/sh -c $cmd 2>&1 | Out-String)) 2500)
            Say '=== pi-omnigent status'
            Say (Trunc (Vm @(($pa + '/bin/pi-omnigent'), 'status')) 2200)
            Say '=== pi-omnigent doctor --json'
            Say (Trunc (Vm @(($pa + '/bin/pi-omnigent'), 'doctor', '--json')) 2200)
            Say '=== pi-omnigent catalog'
            Say (Trunc (Vm @(($pa + '/bin/pi-omnigent'), 'catalog')) 2200)
          }

          Say '=== Paseo: served by pi-web at /paseo-web ?'
          Say ('http status: ' + (curl.exe -s -L -o NUL -w '%{http_code}' --max-time 8 http://localhost:30141/paseo-web))
          foreach ($c in @('status', 'health', 'diagnose')) {
            Say ('=== pi-paseo ' + $c)
            Say (Trunc (Vm @(($pa + '/bin/pi-paseo'), $c)) 1500)
          }
          foreach ($prov in @('claude', 'codex', 'opencode')) {
            Say ('=== pi-paseo models ' + $prov)
            Say (Trunc (Vm @(($pa + '/bin/pi-paseo'), 'models', $prov)) 900)
          }
          wsl -d PiAgent -u piagent --exec /usr/bin/env @envs /usr/bin/systemctl --user stop omnigent-test-server 2>&1 | Out-Null

      - name: E3 keep-alive experiment
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $env:WSL_UTF8 = '1'
          $log = 'ci-out/30-keepalive.txt'
          function Say($t) { $t | Tee-Object -FilePath $log -Append }
          function Probe($label) {
            $http = (curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://localhost:30141/api/home 2>&1 | Out-String).Trim()
            $running = (wsl -l --running 2>&1 | Out-String).Trim()
            $ka = @(Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe' OR Name = 'pwsh.exe'" | Where-Object { $_.CommandLine -like '*keepalive.ps1*' }).Count
            Say ('[' + $label + '] http=' + $http + ' keepalive-processes=' + $ka)
            Say $running
          }
          Probe 'now, keep-alive running'
          Start-Sleep -Seconds 90
          Probe 'after 90 s, keep-alive running'
          Get-CimInstance Win32_Process -Filter "Name = 'powershell.exe' OR Name = 'pwsh.exe'" | Where-Object { $_.CommandLine -like '*keepalive.ps1*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          Get-Process -Name wsl -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 90
          Probe 'after 90 s with NO keep-alive (control)'

      - name: E4 E11 run again, uninstall keeping the data, uninstall purging it
        if: always() && steps.install.outcome == 'success'
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force ci-out | Out-Null
          if (Test-Path "$env:LOCALAPPDATA\PiAgent\install.log") { Copy-Item "$env:LOCALAPPDATA\PiAgent\install.log" ci-out/install.log }
          $log = 'ci-out/40-rerun-uninstall.txt'
          function Say($t) { $t | Tee-Object -FilePath $log -Append }
          $script = Join-Path (Get-Location).Path 'dist\install-wsl.ps1'
          $bundle = Join-Path (Get-Location).Path 'dist\pi-agent-installer-dev.tar.gz'
          $art = 'https://github.com/WOOWTECH/Woow_native_os_pi_agent/releases/download/v0.2.4/piweb-0.10.0-linux-x64.tar.gz'
          $env:WSL_UTF8 = '1'

          Say '=== run again over the finished install, this time WITH the autostart (E11, E4)'
          $out = & $script -Yes -SkipSmoke -BundlePath $bundle -PiWebArtifact $art *>&1
          $code = $LASTEXITCODE
          Say (($out | Select-Object -Last 12 | Out-String).Trim())
          Say ('exit code: ' + $code)
          Say '--- the logon task (E4)'
          Say ((Get-ScheduledTask -TaskName PiAgentWsl -ErrorAction SilentlyContinue | Select-Object TaskName, State | Format-List | Out-String).Trim())
          $t = Get-ScheduledTask -TaskName PiAgentWsl -ErrorAction SilentlyContinue
          if ($t) {
            Say ('action: ' + $t.Actions[0].Execute + ' ' + $t.Actions[0].Arguments)
            Say ('trigger: ' + ($t.Triggers | ForEach-Object { $_.CimClass.CimClassName }))
            Say ('settings: disallow-start-on-battery=' + $t.Settings.DisallowStartIfOnBatteries + ' stop-on-battery=' + $t.Settings.StopIfGoingOnBatteries + ' limit=' + $t.Settings.ExecutionTimeLimit + ' hidden=' + $t.Settings.Hidden)
          }

          Say '=== uninstall, keeping the data'
          $out = & $script -Uninstall -Yes -BundlePath $bundle *>&1
          $code = $LASTEXITCODE
          Say (($out | Select-Object -Last 8 | Out-String).Trim())
          Say ('exit code: ' + $code)
          Say ('distros: ' + ((wsl -l -q | Out-String).Trim() -replace "`r?`n", ', '))
          Say ('logon task still there: ' + [bool](Get-ScheduledTask -TaskName PiAgentWsl -ErrorAction SilentlyContinue))
          Say ('pi-agent command folder still there: ' + (Test-Path "$env:LOCALAPPDATA\PiAgent\bin"))
          Say ('distro folder still there: ' + (Test-Path "$env:LOCALAPPDATA\PiAgent\distro"))
          Say '--- start the distro again by hand: the service must NOT come back (item 11 of the review)'
          wsl -d PiAgent -u root --exec /bin/true
          Start-Sleep -Seconds 20
          Say ('is-enabled: ' + ((wsl -d PiAgent -u piagent --exec /usr/bin/env XDG_RUNTIME_DIR=/run/user/1000 /usr/bin/systemctl --user is-enabled pi-web.service 2>&1 | Out-String).Trim()))
          Say ('is-active:  ' + ((wsl -d PiAgent -u piagent --exec /usr/bin/env XDG_RUNTIME_DIR=/run/user/1000 /usr/bin/systemctl --user is-active pi-web.service 2>&1 | Out-String).Trim()))
          Say ('http from Windows: ' + (curl.exe -s -o NUL -w '%{http_code}' --max-time 8 http://localhost:30141/api/home))

          Say '=== uninstall, purging the data'
          $out = & $script -Uninstall -PurgeData -Yes -BundlePath $bundle *>&1
          $code = $LASTEXITCODE
          Say (($out | Select-Object -Last 8 | Out-String).Trim())
          Say ('exit code: ' + $code)
          Say ('distros: ' + ((wsl -l -q | Out-String).Trim() -replace "`r?`n", ', '))
          Say ('backup: ' + ((Get-ChildItem $env:USERPROFILE -Filter 'PiAgent-backup-*.tar' -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + ' ' + [math]::Round($_.Length / 1MB) + ' MiB' }) -join '; '))
          Say ('install folder still there: ' + (Test-Path "$env:LOCALAPPDATA\PiAgent"))

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-out | Out-Null
          $log = Join-Path $env:LOCALAPPDATA 'PiAgent\install.log'
          if (Test-Path $log) { Copy-Item $log ci-out/install.log }
          Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-String | Set-Content ci-out/dist-listing.txt

      # Annotations can be read through GitHub's API without signing in; the job log and the
      # artifact below cannot. So the facts this spike exists to find out are repeated there.
      - name: Summarise into annotations
        if: always()
        shell: pwsh
        run: |
          try {
            foreach ($f in @(Get-ChildItem ci-out -File -ErrorAction SilentlyContinue | Sort-Object Name)) {
              $lines = @(Get-Content -LiteralPath $f.FullName -Tail 60 -ErrorAction SilentlyContinue)
              $text = ($lines -join "`n")
              if ($text.Length -gt 6000) { $text = $text.Substring($text.Length - 6000) }
              $enc = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host ('::notice title=' + $f.Name + '::' + $enc)
            }
          } catch {
            Write-Host ('::warning::could not summarise ci-out: ' + $_)
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl2-e2e-logs
          path: ci-out/
          if-no-files-found: warn
