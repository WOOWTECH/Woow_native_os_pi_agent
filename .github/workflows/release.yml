# Manual dispatch stages version-bound candidates without publishing.
# An explicitly pushed version tag retains the supported prebuilt-tree release
# route. Unsigned Mac pkg files stay in Actions; maintainers sign separately.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp when run manually, e.g. 0.1.0
        required: true

permissions:
  contents: read

jobs:
  artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       label: macos-arm64  }
          - { os: macos-15-intel, label: macos-x64    }
          - { os: ubuntu-latest,  label: linux-x64    }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the source release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(cat VERSION)"
          test "${REQUESTED_VERSION:-$version}" = "$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi

      # Only the stages the artifact needs: the scoped Node, the verified
      # plugin tarballs (the settings patch lives in one of them), and the
      # pi-web build itself.
      - name: Build pi-web
        run: ./install.sh node fetch piweb shared

      - name: Shared runtime under the native Pi SDK
        run: |
          # macOS exposes TMPDIR via /var -> /private/var. Keep fixture HOME
          # paths physical so the frozen SDK authority assertions compare
          # canonical paths, as the full installer gate already does.
          export TMPDIR="$(cd "${TMPDIR:-/tmp}" && pwd -P)"
          export SHARED_RUNTIME_TEST_BUNDLE="${PI_AGENT_HOME:-$HOME/.local/share/pi-agent}/shared-runtime"
          export PI_SHARED_SDK_ROOT="${PI_AGENT_HOME:-$HOME/.local/share/pi-agent}/piweb/lib/node_modules/@agegr/pi-web"
          # Includes real cold/warm headless MCP processes against this installed SDK.
          "${PI_AGENT_HOME:-$HOME/.local/share/pi-agent}/node/bin/node" --test "$SHARED_RUNTIME_TEST_BUNDLE/tests/resource-authority.test.mjs" "$SHARED_RUNTIME_TEST_BUNDLE/tests/resource-boundary.test.mjs" "$SHARED_RUNTIME_TEST_BUNDLE/tests/extension-scan.test.mjs" "$SHARED_RUNTIME_TEST_BUNDLE/tests/bridge.test.mjs" "$SHARED_RUNTIME_TEST_BUNDLE/tests/mcp-adapter.test.mjs"
          NATIVE_DISTRIBUTION=1 "${PI_AGENT_HOME:-$HOME/.local/share/pi-agent}/node/bin/node" --test tests/shared-distribution.test.mjs tests/shared-session.test.mjs

      - name: Package artifact
        run: scripts/build-piweb-artifact.sh dist

      # No credentials or Apple submission: these pkg files are CI candidates.
      - name: Build the bundled tmux
        if: startsWith(matrix.label, 'macos-')
        run: |
          label='${{ matrix.label }}'
          scripts/build-macos-tmux.sh "dist/tools-$label"
          tar czf "dist/tools-$label.tar.gz" -C dist "tools-$label"
          ( cd dist && shasum -a 256 "tools-$label.tar.gz" > "tools-$label.tar.gz.sha256" )
      - name: Build unsigned native package preserving frozen payloads
        if: github.event_name == 'workflow_dispatch' && startsWith(matrix.label, 'macos-')
        run: |
          . lib/pins.sh
          label='${{ matrix.label }}'
          artifact="dist/piweb-$PIN_PI_WEB_VERSION-$label.tar.gz"
          scripts/build-macos-pkg.sh --artifact-file "$artifact" \
            --artifact-sha256 "$(shasum -a 256 "$artifact" | awk '{print $1}')" \
            --tools "dist/tools-$label" --out dist/unsigned
          bash tests/build-macos-pkg.sh
      - name: Retain the original frozen archives without npm pack
        run: |
          cp candidate-packages/*.tgz dist/
          cp candidate-packages/manifest.json dist/frozen-packages.json
          for source in candidate-packages/*.tgz; do cmp "$source" "dist/$(basename "$source")"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.tgz
            dist/*.json
            dist/unsigned/*.pkg
          if-no-files-found: error

  review-candidate:
    needs: artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Record exact candidate bytes for review
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('dist')
          files = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(root.rglob('*')) if p.is_file()}
          frozen = json.loads((root / 'frozen-packages.json').read_text())
          for row in frozen['artifacts']:
              assert files[row['file']] == row['sha256']
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          receipt = {'source': source, 'sourceTree': tree, 'version': pathlib.Path('VERSION').read_text().strip(),
                     'runId': os.environ['GITHUB_RUN_ID'],
                     'published': False, 'macPackagesSigned': False, 'files': files}
          (root / 'release-candidate.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: native-reviewed-candidate-${{ github.sha }}
          path: dist
          if-no-files-found: error

  release:
    needs: review-candidate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-reviewed-candidate-${{ github.sha }}
          path: dist
      - name: Bind public assets to the actual tag build
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          candidate = json.loads((root / 'release-candidate.json').read_text())
          assert candidate['source'] == os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + candidate['version']
          assert candidate['runId'] == os.environ['GITHUB_RUN_ID']
          files = {}
          for file in sorted(root.iterdir()):
              if file.is_file() and (file.name.endswith(('.tar.gz', '.sha256', '.tgz')) or file.name == 'frozen-packages.json'):
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  assert candidate['files'][file.name] == digest
                  files[file.name] = digest
          for platform in ('linux-x64', 'macos-arm64', 'macos-x64'):
              trees = [name for name in files if name.startswith('piweb-') and name.endswith('-' + platform + '.tar.gz')]
              assert len(trees) == 1 and trees[0] + '.sha256' in files
          frozen = json.loads((root / 'frozen-packages.json').read_text())
          for row in frozen['artifacts']:
              assert files[row['file']] == row['sha256']
          receipt = {'source': candidate['source'], 'sourceTree': candidate['sourceTree'],
                     'version': candidate['version'], 'tag': os.environ['GITHUB_REF_NAME'],
                     'runId': candidate['runId'], 'files': files,
                     'macPkg': 'Separate maintainer signing/notarization; unsigned CI pkg excluded'}
          (root / 'release-assets.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - name: Attach source-install assets to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.tgz
            dist/frozen-packages.json
            dist/release-assets.json
          fail_on_unmatched_files: true
          body: |
            Prebuilt Pi Web trees for Linux x64 (Ubuntu/WSL2), macOS arm64 and Intel,
            built from ${{ github.ref_name }} at ${{ github.sha }}.
            Use the matching source tag with PI_AGENT_PIWEB_ARTIFACT=<asset URL> ./install.sh.
            SHA256 files and release-assets.json identify these exact bytes and source tree.
            Frozen Agent Connect/Omnigent/shared-runtime archives retain their npm names and bytes.

            Signed macOS .pkg installers are prepared and attached separately by the maintainer.
            Unsigned CI review packages are not public release assets.
