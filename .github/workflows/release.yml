# Build the downloadable artifacts for a tagged release.
#
# The point of this workflow is the prebuilt pi-web tree. Building it from
# source costs ~15 minutes and a full toolchain, which is fine for the engineer
# track and impossible for someone who just downloaded an installer. CI pays
# that cost once per platform; install.sh then consumes the result through
# PI_AGENT_PIWEB_ARTIFACT and finishes in seconds (measured: 6s on macOS).
#
# The artifact is platform-specific -- node_modules carries native builds
# (node-pty above all) -- so there is one per OS/arch and the installer checks
# the name before using it.
#
# NOT DONE HERE: the macOS .pkg. It is built, signed and notarized on the
# maintainer's Mac, where the Developer ID certificates live -- CI holds no
# signing material -- and it pins the macos-arm64 tree this workflow publishes
# by URL and sha256 rather than embedding it. See docs/MACOS.md:
#
#     scripts/build-macos-tmux.sh
#     scripts/build-macos-pkg.sh --artifact-url <this release's macos-arm64 asset> \
#         --artifact-sha256 <its .sha256> --sign-app ... --sign ... --notary-key ...
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp when run manually, e.g. 0.1.0
        required: true

permissions:
  contents: write

jobs:
  artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,      label: macos-arm64  }
          - { os: ubuntu-latest, label: linux-x64    }
          # Windows on ARM runs WSL2 with an arm64 Ubuntu, which needs this tree. Not
          # built in CI before, so a failure here must not stop the other releases.
          - { os: ubuntu-24.04-arm, label: linux-arm64, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      # Only the stages the artifact needs: the scoped Node, the verified
      # plugin tarballs (the settings patch lives in one of them), and the
      # pi-web build itself.
      - name: Build pi-web
        run: ./install.sh node fetch piweb

      - name: Package artifact
        run: scripts/build-piweb-artifact.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # The Windows (WSL2) installer: the bundle it unpacks inside the new Linux, and
  # install-wsl.ps1 stamped with this release's version, URLs and the bundle's sha256
  # (scripts/build-wsl-bundle.sh; docs/WSL2.md).
  wsl-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the bundle and stamp the installer
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          scripts/build-wsl-bundle.sh dist-wsl "$VERSION" --tag "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-bundle
          path: dist-wsl/*

  windows-sign:
    needs: wsl-bundle
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wsl-bundle
          path: dist-wsl
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned jsign
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'jsign-7.5.jar'
          Invoke-WebRequest 'https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar' -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c') { throw 'Unexpected jsign hash' }
          Add-Content $env:GITHUB_ENV "JSIGN_JAR=$jar"
      - name: Sign script, embed it in the launcher, and sign launcher
        shell: powershell
        env:
          ESIGNER_STOREPASS: ${{ secrets.ESIGNER_STOREPASS }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          ./scripts/sign-windows.ps1 -Path dist-wsl/install-wsl.ps1
          ./scripts/build-windows-launcher.ps1 -Installer dist-wsl/install-wsl.ps1 -Output dist-wsl/Install-Pi-Agent.exe
          ./scripts/sign-windows.ps1 -Path dist-wsl/Install-Pi-Agent.exe
          # No WSL mutations. This checks the actual signed launcher's embedded-script path.
          & ./dist-wsl/Install-Pi-Agent.exe -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'Signed launcher dry run failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-signed
          path: dist-wsl/*
          retention-days: 14

  release:
    needs: [artifact, windows-sign]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{macos-arm64,linux-*,wsl-signed}'
          path: dist
          merge-multiple: true
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          # v1.2.3-rc.1 is a pre-release, which GitHub never makes the latest release: what
          # `releases/latest` gives everybody else stays as it is.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/install-wsl.ps1
            dist/Install-Pi-Agent.cmd
            dist/Install-Pi-Agent.exe
          body: |
            Built by CI from ${{ github.ref_name }}.
            ${{ contains(github.ref_name, '-') && '**Preview: not the latest release.** Read the status at the top of the guide linked below first.' || '' }}

            `piweb-*-<os>-<arch>.tar.gz` is a prebuilt pi-web tree. Point the
            installer at it to skip the ~15 minute source build:

                PI_AGENT_PIWEB_ARTIFACT=<url> ./install.sh

            Windows (WSL2): download `Install-Pi-Agent.exe` and double-click it.
            The launcher and its embedded `install-wsl.ps1` are signed by WOOW TECH CO., LTD.
            The launcher verifies the script before execution. Signing does not guarantee
            that SmartScreen or an organization's policies will allow a new installer.
            `Install-Pi-Agent.cmd` remains a legacy text entry point; it verifies the
            downloaded script but the CMD file itself cannot carry this signature.

            Options, what it changes and how to remove it:
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/WSL2.md

            The macOS `.pkg` is not built here: it is signed and notarized on the
            maintainer's Mac and attached separately.

  # The command in the guide, from where people get it: the script, the bundle and the pi-web tree all
  # come from the release just published. This cannot unpublish anything: a failure here means telling
  # nobody and fixing it in the next release candidate.
  wsl-verify:
    name: the guide's command on Windows (real WSL2)
    needs: release
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $doc = [IO.File]::ReadAllText((Join-Path (Get-Location).Path 'docs\WSL2.md'))
          $m = [regex]::Match($doc, '(?s)<!-- signed-install-command -->\s*```powershell\s*(.*?)\s*```')
          if (-not $m.Success) { Write-Output '::error::no install command in docs/WSL2.md'; exit 1 }
          Write-Output $m.Groups[1].Value
          & ([ScriptBlock]::Create($m.Groups[1].Value.Replace('& $p', '& $p -Yes -NoAutostart')))
          $code = $LASTEXITCODE
          # The file people double-click, from the release, over that install. stdin is NUL here, so its
          # pause returns at once. Nothing can press a key or see a window on a runner.
          $cmdFile = Join-Path (Get-Location).Path 'Install-Pi-Agent.exe'
          Invoke-WebRequest -UseBasicParsing -OutFile $cmdFile ('https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/download/' + $env:GITHUB_REF_NAME + '/Install-Pi-Agent.exe')
          & $cmdFile -Yes -NoAutostart 2>&1 | Out-Null
          $cmdCode = $LASTEXITCODE
          $marker = (wsl.exe -d PiAgent --exec /bin/cat /etc/pi-agent-distro | Out-String)
          $want = 'installer=' + ($env:GITHUB_REF_NAME -replace '^v', '')
          $ok = ($code -eq 0) -and ($cmdCode -eq 0) -and $marker.Contains($want)
          # Annotations can be read through GitHub's API without signing in; the job log cannot.
          $log = Join-Path $env:LOCALAPPDATA 'PiAgent\install.log'
          $tail = if (Test-Path $log) { (Get-Content -LiteralPath $log -Tail 25 -Encoding UTF8) -join "`n" } else { '(no install.log)' }
          $text = ('exit code {0}; double-click file exit code {1}; marker has {2}: {3}' -f $code, $cmdCode, $want, $marker.Contains($want)) + "`n" + $tail
          $level = if ($ok) { 'notice' } else { 'error' }
          Write-Output ('::' + $level + ' title=one-line install::' + $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A'))
          if ($ok) { exit 0 } else { exit 1 }
