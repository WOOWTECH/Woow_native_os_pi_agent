# Build the downloadable artifacts for a tagged release.
#
# The point of this workflow is the prebuilt pi-web tree. Building it from
# source costs ~15 minutes and a full toolchain, which is fine for the engineer
# track and impossible for someone who just downloaded an installer. CI pays
# that cost once per platform; install.sh then consumes the result through
# PI_AGENT_PIWEB_ARTIFACT and finishes in seconds (measured: 6s on macOS).
#
# The artifact is platform-specific -- node_modules carries native builds
# (node-pty above all) -- so there is one per OS/arch and the installer checks
# the name before using it.
#
# NOT DONE HERE: the macOS .pkg. It is built, signed and notarized on the
# maintainer's Mac, where the Developer ID certificates live -- CI holds no
# signing material -- and it pins the macos-arm64 tree this workflow publishes
# by URL and sha256 rather than embedding it. See docs/MACOS.md:
#
#     scripts/build-macos-tmux.sh
#     scripts/build-macos-pkg.sh --artifact-url <this release's macos-arm64 asset> \
#         --artifact-sha256 <its .sha256> --sign-app ... --sign ... --notary-key ...
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp when run manually, e.g. 0.1.0
        required: true

permissions:
  contents: write

jobs:
  artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      label: macos-arm64  }
          - { os: ubuntu-latest, label: linux-x64    }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Only the stages the artifact needs: the scoped Node, the verified
      # plugin tarballs (the settings patch lives in one of them), and the
      # pi-web build itself.
      - name: Build pi-web
        run: ./install.sh node fetch piweb

      - name: Package artifact
        run: scripts/build-piweb-artifact.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: artifact
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          body: |
            Built by CI from ${{ github.ref_name }}.

            `piweb-*-<os>-<arch>.tar.gz` is a prebuilt pi-web tree. Point the
            installer at it to skip the ~15 minute source build:

                PI_AGENT_PIWEB_ARTIFACT=<url> ./install.sh

            The macOS `.pkg` is not built here: it is signed and notarized on the
            maintainer's Mac and attached separately.
